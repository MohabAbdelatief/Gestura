name: Release to App Store Connect

# Manual only. This uploads a build to App Store Connect, so it should never
# fire on a push.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "CFBundleVersion for this build (must be higher than any previously uploaded). Defaults to the run number + 2."
        required: false
        type: string

jobs:
  release:
    # GitHub-hosted runners run a released macOS, which is the whole point:
    # Apple rejects binaries whose BuildMachineOSBuild is an unreleased OS
    # (ITMS-90111), and the local machine is on a macOS beta.
    runs-on: macos-latest

    env:
      SCHEME: Gestura
      PROJECT: Gestura.xcodeproj
      BUILD_NUMBER: ${{ inputs.build_number || github.run_number + 2 }}

    steps:
      - uses: actions/checkout@v4

      - name: Select the newest released Xcode 26
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XC" ]; then
            sudo xcode-select -s "$XC/Contents/Developer"
          fi
          sudo xcodebuild -runFirstLaunch || true
          xcodebuild -version
          sw_vers

      - name: Install the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          cp ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
             ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/*.p8 ~/private_keys/*.p8
          echo "KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Gestura.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Verify the build machine stamp
        run: |
          PLIST="$RUNNER_TEMP/Gestura.xcarchive/Products/Applications/Gestura.app/Info.plist"
          for k in BuildMachineOSBuild DTXcodeBuild DTSDKBuild CFBundleShortVersionString CFBundleVersion; do
            printf '%-28s %s\n' "$k" "$(/usr/libexec/PlistBuddy -c "Print :$k" "$PLIST")"
          done
          # A released macOS build number has no trailing lowercase letter.
          OSB=$(/usr/libexec/PlistBuddy -c "Print :BuildMachineOSBuild" "$PLIST")
          case "$OSB" in
            *[a-z]) echo "::error::BuildMachineOSBuild $OSB looks like a beta OS; Apple will reject this with ITMS-90111"; exit 1 ;;
            *) echo "BuildMachineOSBuild $OSB is a released OS" ;;
          esac

      - name: Export the ipa
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Gestura.xcarchive" \
            -exportOptionsPlist .github/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            -f "$RUNNER_TEMP/export/Gestura.ipa" \
            -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Keep the ipa for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gestura-ipa-build-${{ env.BUILD_NUMBER }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: warn
